name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# What broseat reads is not its own: .desktop files anyone can drop into an
# autostart directory, Exec= lines it tokenizes and executes, and D-Bus replies
# from logind and the user manager. The parser, the Exec= expansion and the
# launch paths (fork/exec, systemd-run argv) are where the realistic bugs are.
#
# Two analyses: Linux (everything) and Windows (the portable parts and the
# unavailable entry points).
#
# The siblings CMake compiles into the build (brodbus on Linux; bronze and
# brass for broseat_api, on in a top-level build) are built ahead of `init`,
# so they are never traced: for a compiled language CodeQL extracts only what
# it watches being compiled, and each sibling is analysed in its own
# repository. Everything broseat owns is built after `init`.
jobs:
  analyze:
    name: Analyze C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v7
        with:
          path: broseat

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brodbus
          path: brodbus

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libsystemd-dev libseat-dev

      - name: Configure and pre-build siblings (outside the traced build)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S broseat -B build -DBROSEAT_BUILD_TESTS=OFF
            cmake --build build --config Debug --parallel 4 --target bronze_runtime_shared
          else
            cmake -S broseat -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBROSEAT_BUILD_TESTS=OFF
            cmake --build build --parallel 4 --target bronze_runtime_shared brodbus
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          source-root: broseat
          queries: security-extended

      - name: Build (traced)
        run: cmake --build build --config Debug --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp/os:${{ runner.os }}
